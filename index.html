<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zdjęcia - dron</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    min-height:100vh;
    background:
    linear-gradient(rgba(0,0,0,.75),rgba(0,0,0,.75)),
    url("https://images.unsplash.com/photo-1501785888041-af3ef285b470?q=80&w=2000&auto=format&fit=crop");
    background-size:cover;
    background-position:center;
    color:white;
}

header{
    text-align:center;
    padding:30px;
    font-size:28px;
    font-weight:bold;
}

.container{
    max-width:1100px;
    margin:auto;
    padding:20px;
}

.card{
    background:rgba(20,20,20,.7);
    border-radius:18px;
    padding:20px;
    margin-bottom:20px;
    backdrop-filter:blur(10px);
}

button{
    padding:12px 16px;
    border:none;
    border-radius:10px;
    cursor:pointer;
    font-weight:bold;
}

.login-btn{
    background:#4285F4;
    color:white;
}

.upload-btn{
    background:#22c55e;
    color:white;
    margin-top:10px;
}

.delete-btn{
    background:#ef4444;
    color:white;
    width:100%;
    margin-top:8px;
}

.gallery{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(250px,1fr));
    gap:15px;
}

.photo{
    background:#111;
    border-radius:15px;
    overflow:hidden;
}

.photo img{
    width:100%;
    height:240px;
    object-fit:cover;
    cursor:pointer;
}

.viewer{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.95);
    display:none;
    justify-content:center;
    align-items:center;
    z-index:9999;
}

.viewer.active{
    display:flex;
}

.viewer img{
    max-width:95%;
    max-height:95%;
}

.close{
    position:absolute;
    top:20px;
    right:30px;
    font-size:40px;
    cursor:pointer;
}
</style>
</head>

<body>

<header>Zdjęcia - dron 🚁</header>

<div class="container">

    <div class="card">
        <button id="loginBtn" class="login-btn">Zaloguj przez Google</button>
        <div id="userBox"></div>

        <div id="uploadBox" style="display:none;">
            <input type="file" id="fileInput" accept="image/*">
            <br>
            <button id="uploadBtn" class="upload-btn">Dodaj zdjęcie</button>
        </div>
    </div>

    <div class="card">
        <div class="gallery" id="gallery"></div>
    </div>

</div>

<div class="viewer" id="viewer">
    <div class="close" id="close">✕</div>
    <img id="viewerImg">
</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js";

import {
getAuth,
GoogleAuthProvider,
signInWithRedirect,
getRedirectResult,
onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.14.0/firebase-auth.js";

import {
getFirestore,
collection,
addDoc,
deleteDoc,
doc,
onSnapshot
} from "https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore.js";


// 🔥 TWOJA KONFIGURACJA (wstawiona)
const firebaseConfig = {
    apiKey: "AIzaSyBDstk_UwkFTGQyiehAXlxaII",
    authDomain: "rbxmhub.firebaseapp.com",
    projectId: "rbxmhub",
    storageBucket: "rbxmhub.firebasestorage.com",
    messagingSenderId: "398660647763",
    appId: "1:398660647763:web:c13468a82fe-36947603fa6"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const provider = new GoogleAuthProvider();

const loginBtn = document.getElementById("loginBtn");
const uploadBox = document.getElementById("uploadBox");
const userBox = document.getElementById("userBox");
const gallery = document.getElementById("gallery");

// 🔥 NAPRAWKA LOGOWANIA
loginBtn.onclick = () => {
    signInWithRedirect(auth, provider);
};

// ważne — obsługa powrotu z Google
getRedirectResult(auth).catch(console.error);

onAuthStateChanged(auth, user => {
    if(user){
        userBox.innerHTML = "Zalogowano jako: " + user.displayName;
        uploadBox.style.display = "block";
        loadGalleryRealtime();
    }
});

function toBase64(file){
    return new Promise((res,rej)=>{
        const reader = new FileReader();
        reader.onload = () => res(reader.result);
        reader.onerror = rej;
        reader.readAsDataURL(file);
    });
}

document.getElementById("uploadBtn").onclick = async () => {
    const file = document.getElementById("fileInput").files[0];
    if(!file) return;

    const base64 = await toBase64(file);

    await addDoc(collection(db,"photos"),{
        image: base64,
        user: auth.currentUser.displayName,
        time: Date.now()
    });

    document.getElementById("fileInput").value = "";
};

function loadGalleryRealtime(){
    onSnapshot(collection(db,"photos"), snap => {
        gallery.innerHTML = "";

        snap.forEach(docu => {
            const data = docu.data();

            const div = document.createElement("div");
            div.className = "photo";

            div.innerHTML = `
                <img src="${data.image}">
                <button class="delete-btn">Usuń</button>
            `;

            div.querySelector("img").onclick = () => openViewer(data.image);

            div.querySelector(".delete-btn").onclick = async () => {
                await deleteDoc(doc(db,"photos",docu.id));
            };

            gallery.appendChild(div);
        });
    });
}

const viewer = document.getElementById("viewer");
const viewerImg = document.getElementById("viewerImg");

function openViewer(img){
    viewer.classList.add("active");
    viewerImg.src = img;
}

document.getElementById("close").onclick = () => {
    viewer.classList.remove("active");
};

viewer.onclick = (e) => {
    if(e.target === viewer){
        viewer.classList.remove("active");
    }
};

</script>

</body>
</html>
