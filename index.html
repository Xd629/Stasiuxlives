<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zdjęcia - dron</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    min-height:100vh;
    background:
    linear-gradient(rgba(0,0,0,.75),rgba(0,0,0,.75)),
    url("https://images.unsplash.com/photo-1501785888041-af3ef285b470?q=80&w=2000&auto=format&fit=crop");
    background-size:cover;
    color:white;
}

header{
    text-align:center;
    padding:30px;
    font-size:28px;
    font-weight:bold;
}

.container{
    max-width:1100px;
    margin:auto;
    padding:20px;
}

.card{
    background:rgba(20,20,20,.75);
    border-radius:18px;
    padding:20px;
    margin-bottom:20px;
    backdrop-filter:blur(10px);
}

button{
    padding:12px 16px;
    border:none;
    border-radius:10px;
    cursor:pointer;
    font-weight:bold;
}

.login-btn{
    background:#4285F4;
    color:white;
}

.logout-btn{
    background:#64748b;
    color:white;
    margin-left:8px;
}

.upload-btn{
    background:#22c55e;
    color:white;
    margin-top:10px;
}

.delete-btn{
    background:#ef4444;
    color:white;
    width:100%;
    margin-top:8px;
}

button:disabled{
    opacity:.6;
    cursor:not-allowed;
}

.message{
    margin-top:12px;
    line-height:1.4;
}

.message.success{
    color:#86efac;
}

.message.error{
    color:#fca5a5;
}

.photo-meta,
.empty{
    padding:10px;
    color:#d1d5db;
    font-size:14px;
}

.gallery{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(250px,1fr));
    gap:15px;
}

.photo{
    background:#111;
    border-radius:15px;
    overflow:hidden;
}

.photo img{
    width:100%;
    height:240px;
    object-fit:cover;
    cursor:pointer;
}

.viewer{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.95);
    display:none;
    justify-content:center;
    align-items:center;
    z-index:9999;
}

.viewer.active{
    display:flex;
}

.viewer img{
    max-width:95%;
    max-height:95%;
}

.close{
    position:absolute;
    top:20px;
    right:30px;
    font-size:40px;
    cursor:pointer;
}
</style>
</head>

<body>

<header>Zdjęcia - dron 🚁</header>

<div class="container">

    <div class="card">
        <button id="loginBtn" class="login-btn">Zaloguj przez Google</button>
        <button id="logoutBtn" class="logout-btn" style="display:none;">Wyloguj</button>
        <div id="userBox"></div>

        <div id="uploadBox" style="display:none;">
            <input type="file" id="fileInput" accept="image/*">
            <br>
            <button id="uploadBtn" class="upload-btn">Dodaj zdjęcie</button>
        </div>
    </div>

    <div class="card">
        <div class="gallery" id="gallery"></div>
    </div>

</div>

<div class="viewer" id="viewer">
    <div class="close" id="close">✕</div>
    <img id="viewerImg">
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";
import {
  getAuth,
  GoogleAuthProvider,
  signInWithPopup,
  signInWithRedirect,
  signOut,
  getRedirectResult,
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.7.0/firebase-auth.js";
import {
  getFirestore,
  collection,
  addDoc,
  deleteDoc,
  doc,
  onSnapshot,
  orderBy,
  query
} from "https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore.js";

// Konfiguracja Firebase dla projektu rbxmhub.
const firebaseConfig = {
    apiKey: "AIzaSyBDstk_UwkFTGqQyiehAXjMvnElxclxaII",
    authDomain: "rbxmhub.firebaseapp.com",
    projectId: "rbxmhub",
    storageBucket: "rbxmhub.appspot.com",
    messagingSenderId: "398660647763",
    appId: "1:398660647763:web:c13468a82fe36947603fa6"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const provider = new GoogleAuthProvider();
const ADMIN_EMAIL = "playstationsony106@gmail.com";

const loginBtn = document.getElementById("loginBtn");
const logoutBtn = document.getElementById("logoutBtn");
const uploadBtn = document.getElementById("uploadBtn");
const fileInput = document.getElementById("fileInput");
const uploadBox = document.getElementById("uploadBox");
const userBox = document.getElementById("userBox");
const gallery = document.getElementById("gallery");
const viewer = document.getElementById("viewer");
const viewerImg = document.getElementById("viewerImg");

let unsubscribeGallery = null;

function showMessage(text, type = "info") {
    userBox.textContent = text;
    userBox.className = `message ${type}`;
}

function showError(error) {
    console.error(error);
    const details = error?.message ? ` (${error.message})` : "";
    showMessage(`Błąd: ${details}`, "error");
}

function isAdmin(user) {
    return user?.email?.toLowerCase() === ADMIN_EMAIL;
}

logoutBtn.addEventListener("click", async () => {
    logoutBtn.disabled = true;
    showMessage("Wylogowywanie...", "info");

    try {
        await signOut(auth);
        showMessage("Wylogowano.", "success");
    } catch (error) {
        showError(error);
    } finally {
        logoutBtn.disabled = false;
    }
});

loginBtn.addEventListener("click", async () => {
    loginBtn.disabled = true;
    showMessage("Logowanie...", "info");

    try {
        await signInWithPopup(auth, provider);
    } catch (error) {
        // Popup może być blokowany przez przeglądarkę, więc wtedy używamy redirectu.
        if (error?.code === "auth/popup-blocked" || error?.code === "auth/cancelled-popup-request") {
            await signInWithRedirect(auth, provider);
            return;
        }

        showError(error);
        loginBtn.disabled = false;
    }
});

getRedirectResult(auth).catch(showError);

onAuthStateChanged(auth, user => {
    if (user) {
        const admin = isAdmin(user);

        loginBtn.style.display = "none";
        logoutBtn.style.display = "inline-block";
        uploadBox.style.display = admin ? "block" : "none";
        showMessage(
            admin
                ? `Zalogowano jako admin: ${user.displayName || user.email}`
                : `Zalogowano jako: ${user.displayName || user.email}. Możesz oglądać zdjęcia, ale tylko ${ADMIN_EMAIL} może dodawać i usuwać.`,
            admin ? "success" : "info"
        );
        loadGallery();
        return;
    }

    loginBtn.disabled = false;
    loginBtn.style.display = "inline-block";
    logoutBtn.disabled = false;
    logoutBtn.style.display = "none";
    uploadBox.style.display = "none";
    gallery.innerHTML = "";
    showMessage("Zaloguj się, aby dodawać i usuwać zdjęcia.", "info");

    if (unsubscribeGallery) {
        unsubscribeGallery();
        unsubscribeGallery = null;
    }
});

function imageToBase64(file) {
    return new Promise((resolve, reject) => {
        if (!file.type.startsWith("image/")) {
            reject(new Error("Wybierz plik graficzny."));
            return;
        }

        const reader = new FileReader();
        reader.onload = () => {
            const img = new Image();
            img.onload = () => {
                const maxSize = 1280;
                const scale = Math.min(1, maxSize / Math.max(img.width, img.height));
                const canvas = document.createElement("canvas");
                canvas.width = Math.round(img.width * scale);
                canvas.height = Math.round(img.height * scale);

                const ctx = canvas.getContext("2d");
                ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                resolve(canvas.toDataURL("image/jpeg", 0.82));
            };
            img.onerror = () => reject(new Error("Nie udało się odczytać zdjęcia."));
            img.src = reader.result;
        };
        reader.onerror = () => reject(new Error("Nie udało się odczytać pliku."));
        reader.readAsDataURL(file);
    });
}

uploadBtn.addEventListener("click", async () => {
    const file = fileInput.files[0];

    if (!auth.currentUser) {
        showMessage("Najpierw zaloguj się przez Google.", "error");
        return;
    }

    if (!isAdmin(auth.currentUser)) {
        showMessage(`Tylko ${ADMIN_EMAIL} może dodawać zdjęcia.`, "error");
        return;
    }

    if (!file) {
        showMessage("Wybierz zdjęcie do dodania.", "error");
        return;
    }

    uploadBtn.disabled = true;
    showMessage("Dodawanie zdjęcia...", "info");

    try {
        const image = await imageToBase64(file);

        if (image.length > 900_000) {
            throw new Error("Zdjęcie jest za duże po kompresji. Wybierz mniejszy plik.");
        }

        await addDoc(collection(db, "photos"), {
            image,
            user: auth.currentUser.displayName || auth.currentUser.email,
            uid: auth.currentUser.uid,
            time: Date.now()
        });

        fileInput.value = "";
        showMessage("Zdjęcie dodane.", "success");
    } catch (error) {
        showError(error);
    } finally {
        uploadBtn.disabled = false;
    }
});

function loadGallery() {
    if (unsubscribeGallery) return;

    const photosQuery = query(collection(db, "photos"), orderBy("time", "desc"));

    unsubscribeGallery = onSnapshot(photosQuery, snap => {
        gallery.innerHTML = "";

        if (snap.empty) {
            gallery.innerHTML = '<p class="empty">Brak zdjęć. Dodaj pierwsze zdjęcie.</p>';
            return;
        }

        snap.forEach(photoDoc => {
            const data = photoDoc.data();
            const div = document.createElement("div");
            div.className = "photo";

            const img = document.createElement("img");
            img.src = data.image;
            img.alt = `Zdjęcie dodane przez ${data.user || "użytkownika"}`;
            img.addEventListener("click", () => openViewer(data.image));

            const meta = document.createElement("p");
            meta.className = "photo-meta";
            meta.textContent = data.user ? `Autor: ${data.user}` : "Autor nieznany";

            div.append(img, meta);

            if (isAdmin(auth.currentUser)) {
                const deleteBtn = document.createElement("button");
                deleteBtn.className = "delete-btn";
                deleteBtn.type = "button";
                deleteBtn.textContent = "Usuń";
                deleteBtn.addEventListener("click", async () => {
                    if (!isAdmin(auth.currentUser)) {
                        showMessage(`Tylko ${ADMIN_EMAIL} może usuwać zdjęcia.`, "error");
                        return;
                    }

                    deleteBtn.disabled = true;
                    try {
                        await deleteDoc(doc(db, "photos", photoDoc.id));
                    } catch (error) {
                        showError(error);
                        deleteBtn.disabled = false;
                    }
                });

                div.appendChild(deleteBtn);
            }
            gallery.appendChild(div);
        });
    }, showError);
}

function openViewer(img) {
    viewer.classList.add("active");
    viewerImg.src = img;
}

document.getElementById("close").addEventListener("click", () => {
    viewer.classList.remove("active");
});

viewer.addEventListener("click", e => {
    if (e.target === viewer) {
        viewer.classList.remove("active");
    }
});
</script>

</body>
</html>
