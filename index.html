<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#050816">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<title>Zdjęcia - dron</title>

<style>
:root{
    --bg:#050816;
    --card:rgba(10,18,35,.72);
    --card-border:rgba(255,255,255,.14);
    --text:#f8fafc;
    --muted:#cbd5e1;
    --blue:#60a5fa;
    --green:#22c55e;
    --red:#ef4444;
    --violet:#a78bfa;
    --amber:#f59e0b;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Inter,Arial,sans-serif;
}

body{
    min-height:100vh;
    background:
        radial-gradient(circle at top left,rgba(96,165,250,.32),transparent 34%),
        radial-gradient(circle at top right,rgba(167,139,250,.28),transparent 30%),
        linear-gradient(rgba(5,8,22,.78),rgba(5,8,22,.86)),
        url("https://images.unsplash.com/photo-1501785888041-af3ef285b470?q=80&w=2000&auto=format&fit=crop");
    background-attachment:fixed;
    background-position:center;
    background-size:cover;
    color:var(--text);
}

header{
    max-width:1100px;
    margin:0 auto;
    padding:46px 20px 18px;
    text-align:left;
    font-size:clamp(34px,6vw,64px);
    font-weight:900;
    letter-spacing:-.05em;
    text-shadow:0 18px 45px rgba(0,0,0,.55);
}

.container{
    max-width:1100px;
    margin:auto;
    padding:20px;
}

.card{
    background:var(--card);
    border:1px solid var(--card-border);
    border-radius:28px;
    padding:24px;
    margin-bottom:22px;
    box-shadow:0 24px 90px rgba(0,0,0,.42);
    backdrop-filter:blur(18px);
}

.auth-actions,
.toolbar,
.viewer-actions,
.photo-actions{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    align-items:center;
}

.toolbar{
    justify-content:space-between;
    margin-bottom:16px;
}

button,
.action-link{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:6px;
    padding:13px 18px;
    border:none;
    border-radius:999px;
    cursor:pointer;
    font-weight:800;
    letter-spacing:.01em;
    text-decoration:none;
    transition:transform .18s ease,box-shadow .18s ease,opacity .18s ease,background .18s ease;
}

button:hover:not(:disabled),
.action-link:hover{
    transform:translateY(-2px);
}

.login-btn{
    background:linear-gradient(135deg,#4285f4,var(--blue));
    color:white;
    box-shadow:0 12px 30px rgba(66,133,244,.34);
}

.logout-btn,
.secondary-btn,
.action-link{
    background:rgba(100,116,139,.34);
    color:white;
    border:1px solid rgba(255,255,255,.16);
}

.upload-btn{
    background:linear-gradient(135deg,var(--green),#16a34a);
    color:white;
    margin-top:12px;
    box-shadow:0 12px 30px rgba(34,197,94,.28);
}

.delete-btn{
    background:linear-gradient(135deg,var(--red),#b91c1c);
    color:white;
    box-shadow:0 10px 24px rgba(239,68,68,.2);
}

button:disabled{
    opacity:.6;
    cursor:not-allowed;
}

input[type="file"]{
    width:100%;
    max-width:420px;
    margin-top:18px;
    padding:12px;
    color:var(--muted);
    background:rgba(15,23,42,.66);
    border:1px dashed rgba(255,255,255,.24);
    border-radius:18px;
}

.password-input,
.description-input{
    padding:13px 18px;
    color:var(--text);
    background:rgba(15,23,42,.66);
    border:1px solid rgba(255,255,255,.16);
    border-radius:999px;
    outline:none;
}

.description-input{
    width:100%;
    min-height:44px;
    resize:vertical;
    border-radius:16px;
}

.message{
    display:inline-flex;
    align-items:center;
    min-height:34px;
    margin-top:14px;
    padding:8px 13px;
    border-radius:999px;
    background:rgba(148,163,184,.14);
    color:var(--muted);
    line-height:1.35;
    font-weight:700;
}

.message.success{
    background:rgba(34,197,94,.15);
    color:#86efac;
}

.message.error{
    background:rgba(239,68,68,.14);
    color:#fca5a5;
}

.message.warning{
    background:rgba(245,158,11,.16);
    color:#fcd34d;
}

.drop-zone{
    display:block;
    margin-top:18px;
    padding:20px;
    color:var(--muted);
    background:rgba(15,23,42,.46);
    border:2px dashed rgba(255,255,255,.26);
    border-radius:22px;
    transition:border-color .2s ease,background .2s ease,transform .2s ease;
}

.drop-zone.drag-over{
    border-color:var(--green);
    background:rgba(34,197,94,.12);
    transform:translateY(-2px);
}

.hint{
    display:block;
    margin-top:8px;
    color:var(--muted);
    font-size:14px;
}

.gallery{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(250px,1fr));
    gap:18px;
}

.photo{
    position:relative;
    background:rgba(2,6,23,.72);
    border:1px solid rgba(255,255,255,.11);
    border-radius:22px;
    overflow:hidden;
    box-shadow:0 18px 45px rgba(0,0,0,.24);
    animation:fadeInUp .35s ease both;
}

.photo.selected{
    outline:3px solid var(--blue);
}

.photo-check{
    position:absolute;
    top:12px;
    left:12px;
    z-index:2;
    width:22px;
    height:22px;
    accent-color:var(--blue);
}

.media-wrap{
    position:relative;
    overflow:hidden;
}

.media-watermark{
    position:absolute;
    right:12px;
    bottom:12px;
    padding:5px 9px;
    border-radius:999px;
    background:rgba(0,0,0,.46);
    color:white;
    font-size:12px;
    font-weight:900;
    text-shadow:0 1px 5px rgba(0,0,0,.8);
    pointer-events:none;
}

.video-badge,
.duration-badge{
    position:absolute;
    top:12px;
    right:12px;
    padding:5px 9px;
    border-radius:999px;
    background:rgba(2,6,23,.72);
    color:white;
    font-size:12px;
    font-weight:900;
}

.duration-badge{
    top:auto;
    bottom:12px;
}

.photo img,
.photo video{
    width:100%;
    height:250px;
    display:block;
    object-fit:cover;
    cursor:pointer;
    transition:transform .25s ease,filter .25s ease;
}

.photo img:hover,
.photo video:hover{
    transform:scale(1.035);
    filter:saturate(1.12);
}

.photo-meta,
.empty,
.photo-description{
    padding:12px 14px;
    color:var(--muted);
    font-size:14px;
}

.photo-description{
    padding-top:0;
    color:var(--text);
    white-space:pre-wrap;
}

.photo-actions{
    padding:0 10px 12px;
}

.photo-actions button,
.photo-actions .action-link{
    flex:1;
    min-width:105px;
    padding:10px 12px;
    font-size:13px;
}

.empty{
    grid-column:1/-1;
    text-align:center;
}

.load-more-wrap{
    margin-top:18px;
    text-align:center;
}

.viewer{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.95);
    display:none;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    gap:14px;
    padding:72px 18px 28px;
    z-index:9999;
}

.viewer.active{
    display:flex;
}

.viewer-media{
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;
    max-width:95%;
    max-height:82%;
}

.viewer img,
.viewer video{
    max-width:100%;
    max-height:82vh;
    border-radius:18px;
    box-shadow:0 30px 100px rgba(0,0,0,.7);
}

.viewer-watermark{
    position:absolute;
    right:18px;
    bottom:18px;
    padding:7px 11px;
    border-radius:999px;
    background:rgba(0,0,0,.5);
    color:white;
    font-size:14px;
    font-weight:900;
    pointer-events:none;
}

.close{
    position:absolute;
    top:20px;
    right:30px;
    font-size:40px;
    cursor:pointer;
}

.viewer-nav{
    position:absolute;
    top:50%;
    transform:translateY(-50%);
    width:48px;
    height:48px;
    padding:0;
    border-radius:50%;
    background:rgba(15,23,42,.78);
    color:white;
    font-size:30px;
}

.viewer-nav.prev{
    left:18px;
}

.viewer-nav.next{
    right:18px;
}

@keyframes fadeInUp{
    from{opacity:0; transform:translateY(12px);}
    to{opacity:1; transform:translateY(0);}
}

@media (max-width:700px){
    header{
        padding:30px 16px 8px;
        letter-spacing:-.035em;
    }

    .container{
        padding:14px;
    }

    .card{
        padding:16px;
        border-radius:22px;
    }

    .auth-actions,
    .toolbar,
    .viewer-actions{
        align-items:stretch;
        flex-direction:column;
    }

    button,
    .action-link,
    .password-input{
        width:100%;
    }

    .gallery{
        grid-template-columns:1fr;
    }

    .photo img,
    .photo video{
        height:220px;
    }

    .viewer{
        padding-left:8px;
        padding-right:8px;
    }

    .viewer-nav{
        top:auto;
        bottom:88px;
        transform:none;
    }
}
</style>
</head>

<body>

<header>Zdjęcia - dron 🚁</header>

<div class="container">

    <div class="card">
        <div class="auth-actions">
            <input type="password" id="passwordInput" class="password-input" placeholder="Hasło">
            <button id="passwordBtn" class="logout-btn">OK</button>
            <button id="logoutBtn" class="logout-btn" style="display:none;">Wyloguj</button>
        </div>
        <div id="userBox"></div>

        <div id="uploadBox" style="display:none;">
            <label class="drop-zone" id="dropZone">
                <strong>Przeciągnij zdjęcia / filmy tutaj</strong>
                <span class="hint">albo wybierz pliki ręcznie. Duże filmy pokażą ostrzeżenie przed dodaniem.</span>
                <input type="file" id="fileInput" accept="image/*,video/*" multiple>
            </label>
            <button id="uploadBtn" class="upload-btn">Dodaj zdjęcia / filmy</button>
        </div>
    </div>

    <div class="card">
        <div class="toolbar" id="galleryToolbar" style="display:none;">
            <span id="galleryCount" class="hint"></span>
            <div class="auth-actions">
                <button id="selectAllBtn" class="secondary-btn" type="button" style="display:none;">Zaznacz wszystko</button>
                <button id="bulkDeleteBtn" class="delete-btn" type="button" style="display:none;">Usuń zaznaczone</button>
            </div>
        </div>
        <div class="gallery" id="gallery"></div>
        <div class="load-more-wrap">
            <button id="loadMoreBtn" class="secondary-btn" type="button" style="display:none;">Załaduj więcej</button>
        </div>
    </div>

</div>

<div class="viewer" id="viewer">
    <div class="close" id="close">✕</div>
    <button id="prevBtn" class="viewer-nav prev" type="button" aria-label="Poprzednie">‹</button>
    <button id="nextBtn" class="viewer-nav next" type="button" aria-label="Następne">›</button>
    <div class="viewer-media">
        <img id="viewerImg">
        <video id="viewerVideo" controls></video>
        <span class="viewer-watermark">zdjecia-z-drona.vercel.app</span>
    </div>
    <div class="viewer-actions">
        <button id="downloadBtn" class="secondary-btn" type="button">Pobierz</button>
        <button id="savePhoneBtn" class="secondary-btn" type="button">Zapisz w telefonie</button>
        <button id="copyLinkBtn" class="secondary-btn" type="button">Kopiuj link</button>
    </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";
import {
  getAuth,
  GoogleAuthProvider,
  signInWithPopup,
  signInWithRedirect,
  signOut,
  getRedirectResult,
  getIdTokenResult,
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.7.0/firebase-auth.js";
import {
  getFirestore,
  collection,
  addDoc,
  deleteDoc,
  doc,
  onSnapshot,
  orderBy,
  query,
  updateDoc,
  writeBatch
} from "https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore.js";

// Konfiguracja Firebase dla projektu rbxmhub.
const firebaseConfig = {
    apiKey: "AIzaSyBDstk_UwkFTGqQyiehAXjMvnElxclxaII",
    authDomain: "rbxmhub.firebaseapp.com",
    projectId: "rbxmhub",
    storageBucket: "rbxmhub.appspot.com",
    messagingSenderId: "398660647763",
    appId: "1:398660647763:web:c13468a82fe36947603fa6"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const provider = new GoogleAuthProvider();
provider.addScope("email");
provider.setCustomParameters({ prompt: "select_account" });

const ADMIN_EMAIL = "playstationsony106@gmail.com";
const PREVIEW_PASSWORD = "dji-mini-5-pro";
const UPLOAD_PASSWORD = "dji-upload";
const SESSION_MS = 10 * 60 * 1000;
const LOCK_MS = 60 * 1000;
const MAX_BAD_ATTEMPTS = 5;
const PAGE_SIZE = 12;
const WATERMARK_TEXT = "zdjecia-z-drona.vercel.app";
const LARGE_VIDEO_WARNING_BYTES = 650_000;

const passwordInput = document.getElementById("passwordInput");
const passwordBtn = document.getElementById("passwordBtn");
const logoutBtn = document.getElementById("logoutBtn");
const uploadBtn = document.getElementById("uploadBtn");
const fileInput = document.getElementById("fileInput");
const uploadBox = document.getElementById("uploadBox");
const dropZone = document.getElementById("dropZone");
const userBox = document.getElementById("userBox");
const gallery = document.getElementById("gallery");
const galleryToolbar = document.getElementById("galleryToolbar");
const galleryCount = document.getElementById("galleryCount");
const selectAllBtn = document.getElementById("selectAllBtn");
const bulkDeleteBtn = document.getElementById("bulkDeleteBtn");
const loadMoreBtn = document.getElementById("loadMoreBtn");
const viewer = document.getElementById("viewer");
const viewerImg = document.getElementById("viewerImg");
const viewerVideo = document.getElementById("viewerVideo");
const prevBtn = document.getElementById("prevBtn");
const nextBtn = document.getElementById("nextBtn");
const downloadBtn = document.getElementById("downloadBtn");
const savePhoneBtn = document.getElementById("savePhoneBtn");
const copyLinkBtn = document.getElementById("copyLinkBtn");

let unsubscribeGallery = null;
let canPreview = false;
let canUpload = false;
let canManage = false;
let passwordMode = null;
let passwordSessionTimer = null;
let allPhotos = [];
let displayedCount = PAGE_SIZE;
let selectedPhotos = new Set();
let currentViewerIndex = -1;
const googleLoginRequested = new URLSearchParams(window.location.search).has("google-login");
let googleLoginStarted = false;

function showMessage(text, type = "info") {
    userBox.textContent = text;
    userBox.className = `message ${type}`;
}

function friendlyError(error) {
    const code = error?.code || "";
    if (code.includes("permission-denied")) return "Brak uprawnień do tej akcji.";
    if (code.includes("unavailable")) return "Nie ma teraz połączenia z bazą. Spróbuj ponownie za chwilę.";
    if (code.includes("popup-closed")) return "Okno logowania zostało zamknięte.";
    if (code.includes("network")) return "Problem z internetem. Sprawdź połączenie.";
    return error?.message || "Nieznany błąd. Spróbuj ponownie.";
}

function showError(error) {
    console.error(error);
    showMessage(`Błąd: ${friendlyError(error)}`, "error");
}

function normalizeEmail(email) {
    return (email || "").trim().toLowerCase();
}

function getUserEmails(user, tokenResult = null) {
    return [
        user?.email,
        tokenResult?.claims?.email,
        ...(user?.providerData || []).map(profile => profile.email)
    ]
        .map(normalizeEmail)
        .filter(Boolean);
}

function isAdmin(user, tokenResult = null) {
    return getUserEmails(user, tokenResult).includes(ADMIN_EMAIL);
}

async function getAdminState(user) {
    if (!user) return false;

    try {
        await user.reload();
        const currentUser = auth.currentUser || user;
        const tokenResult = await getIdTokenResult(currentUser, true);
        return isAdmin(currentUser, tokenResult);
    } catch (error) {
        console.warn("Nie udało się odświeżyć danych użytkownika.", error);
        return isAdmin(auth.currentUser || user);
    }
}

function showPasswordControls(show) {
    passwordInput.style.display = show ? "inline-block" : "none";
    passwordBtn.style.display = show ? "inline-block" : "none";
}

function setAccess({ preview, upload, manage, mode, message, type = "info" }) {
    canPreview = preview;
    canUpload = upload;
    canManage = manage;
    passwordMode = mode;
    showPasswordControls(!preview);
    logoutBtn.style.display = preview ? "inline-block" : "none";
    uploadBox.style.display = upload ? "block" : "none";
    showMessage(message, type);
    loadGallery();
    renderGallery();
}

function clearPasswordSessionTimer() {
    if (passwordSessionTimer) {
        clearTimeout(passwordSessionTimer);
        passwordSessionTimer = null;
    }
}

function startPasswordSessionTimer() {
    clearPasswordSessionTimer();
    passwordSessionTimer = setTimeout(() => {
        resetAccess("Dostęp z hasła wygasł po 10 minutach. Pliki zostają w galerii — wpisz hasło ponownie, aby dalej działać.", "warning");
    }, SESSION_MS);
}

function enablePasswordPreview() {
    setAccess({
        preview: true,
        upload: false,
        manage: false,
        mode: "preview",
        message: "Podgląd galerii. Hasło działa przez 10 minut; pliki nie znikają po wygaśnięciu."
    });
    startPasswordSessionTimer();
}

function enableUploadMode() {
    setAccess({
        preview: true,
        upload: true,
        manage: false,
        mode: "upload",
        message: "Tryb dodawania. Hasło uploadu działa przez 10 minut; dodane pliki zostają w galerii.",
        type: "success"
    });
    startPasswordSessionTimer();
}

function getLockUntil() {
    return Number(localStorage.getItem("galleryLockUntil") || 0);
}

function getBadAttempts() {
    return Number(localStorage.getItem("galleryBadAttempts") || 0);
}

function clearBadAttempts() {
    localStorage.removeItem("galleryBadAttempts");
    localStorage.removeItem("galleryLockUntil");
}

function registerBadPassword() {
    const attempts = getBadAttempts() + 1;
    localStorage.setItem("galleryBadAttempts", String(attempts));

    if (attempts >= MAX_BAD_ATTEMPTS) {
        localStorage.setItem("galleryLockUntil", String(Date.now() + LOCK_MS));
        localStorage.setItem("galleryBadAttempts", "0");
        showMessage("Za dużo złych prób. Logowanie hasłem zablokowane na 1 minutę.", "error");
        return;
    }

    showMessage(`Złe hasło. Pozostało prób: ${MAX_BAD_ATTEMPTS - attempts}.`, "error");
}

passwordBtn.addEventListener("click", () => {
    const lockUntil = getLockUntil();
    if (lockUntil > Date.now()) {
        const seconds = Math.ceil((lockUntil - Date.now()) / 1000);
        showMessage(`Hasło chwilowo zablokowane. Spróbuj za ${seconds} s.`, "error");
        return;
    }

    const value = passwordInput.value.trim();
    passwordInput.value = "";

    if (value === PREVIEW_PASSWORD) {
        clearBadAttempts();
        enablePasswordPreview();
        return;
    }

    if (value === UPLOAD_PASSWORD) {
        clearBadAttempts();
        enableUploadMode();
        return;
    }

    registerBadPassword();
});

passwordInput.addEventListener("keydown", event => {
    if (event.key === "Enter") {
        passwordBtn.click();
    }
});

async function resetAccess(message = "Wylogowano.", type = "success") {
    clearPasswordSessionTimer();
    canPreview = false;
    canUpload = false;
    canManage = false;
    passwordMode = null;
    selectedPhotos.clear();

    try {
        if (auth.currentUser) {
            await signOut(auth);
        }
    } catch (error) {
        console.warn("Nie udało się wylogować Firebase.", error);
    }

    showPasswordControls(true);
    logoutBtn.disabled = false;
    logoutBtn.style.display = "none";
    uploadBox.style.display = "none";
    gallery.innerHTML = "";
    galleryToolbar.style.display = "none";
    loadMoreBtn.style.display = "none";
    showMessage(message, type);

    if (unsubscribeGallery) {
        unsubscribeGallery();
        unsubscribeGallery = null;
    }
}

logoutBtn.addEventListener("click", async () => {
    logoutBtn.disabled = true;
    showMessage("Wylogowywanie...", "info");
    await resetAccess();
});

async function startGoogleLogin() {
    googleLoginStarted = true;
    showMessage("Logowanie Google...", "info");

    try {
        await signInWithPopup(auth, provider);
    } catch (error) {
        // Popup może być blokowany przez przeglądarkę, więc wtedy używamy redirectu.
        if (error?.code === "auth/popup-blocked" || error?.code === "auth/cancelled-popup-request") {
            await signInWithRedirect(auth, provider);
            return;
        }

        showError(error);
    }
}

getRedirectResult(auth).catch(showError);

onAuthStateChanged(auth, async user => {
    if (user) {
        clearPasswordSessionTimer();
        showMessage("Sprawdzanie uprawnień...", "info");
        const admin = await getAdminState(user);

        if (auth.currentUser?.uid !== user.uid) return;

        setAccess({
            preview: true,
            upload: admin,
            manage: admin,
            mode: "google",
            message: admin ? "Tryb administratora." : "Podgląd.",
            type: admin ? "success" : "info"
        });
        return;
    }

    if (passwordMode) return;

    canPreview = false;
    canUpload = false;
    canManage = false;
    showPasswordControls(true);
    logoutBtn.disabled = false;
    logoutBtn.style.display = "none";
    uploadBox.style.display = "none";
    gallery.innerHTML = "";
    galleryToolbar.style.display = "none";
    loadMoreBtn.style.display = "none";
    showMessage("Wpisz hasło do podglądu albo hasło uploadu.", "info");

    if (googleLoginRequested && !googleLoginStarted) {
        startGoogleLogin();
    }

    if (unsubscribeGallery) {
        unsubscribeGallery();
        unsubscribeGallery = null;
    }
});

function imageToBase64(file) {
    return new Promise((resolve, reject) => {
        if (!file.type.startsWith("image/")) {
            reject(new Error("Wybierz plik graficzny."));
            return;
        }

        const reader = new FileReader();
        reader.onload = () => {
            const img = new Image();
            img.onload = () => {
                const maxSize = 1280;
                const scale = Math.min(1, maxSize / Math.max(img.width, img.height));
                const canvas = document.createElement("canvas");
                canvas.width = Math.round(img.width * scale);
                canvas.height = Math.round(img.height * scale);

                const ctx = canvas.getContext("2d");
                ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                drawWatermark(ctx, canvas.width, canvas.height, 0.72);
                resolve(canvas.toDataURL("image/jpeg", 0.82));
            };
            img.onerror = () => reject(new Error("Nie udało się odczytać zdjęcia."));
            img.src = reader.result;
        };
        reader.onerror = () => reject(new Error("Nie udało się odczytać pliku."));
        reader.readAsDataURL(file);
    });
}

function readFileAsDataUrl(file) {
    return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = () => reject(new Error("Nie udało się odczytać pliku."));
        reader.readAsDataURL(file);
    });
}

function formatDuration(seconds) {
    if (!Number.isFinite(seconds)) return "";
    const minutes = Math.floor(seconds / 60);
    const rest = Math.floor(seconds % 60).toString().padStart(2, "0");
    return `${minutes}:${rest}`;
}

function getVideoDetails(file) {
    return new Promise((resolve, reject) => {
        const url = URL.createObjectURL(file);
        const video = document.createElement("video");
        video.preload = "metadata";
        video.muted = true;
        video.playsInline = true;

        video.onloadedmetadata = () => {
            const duration = formatDuration(video.duration);
            video.currentTime = Math.min(1, Math.max(0, video.duration / 3 || 0));
            video.onseeked = () => {
                try {
                    const canvas = document.createElement("canvas");
                    const width = video.videoWidth || 640;
                    const height = video.videoHeight || 360;
                    const maxSize = 640;
                    const scale = Math.min(1, maxSize / Math.max(width, height));
                    canvas.width = Math.round(width * scale);
                    canvas.height = Math.round(height * scale);
                    const ctx = canvas.getContext("2d");
                    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                    drawWatermark(ctx, canvas.width, canvas.height, 0.72);
                    URL.revokeObjectURL(url);
                    resolve({ thumbnail: canvas.toDataURL("image/jpeg", 0.78), duration });
                } catch (error) {
                    URL.revokeObjectURL(url);
                    reject(error);
                }
            };
        };

        video.onerror = () => {
            URL.revokeObjectURL(url);
            reject(new Error("Nie udało się przygotować miniatury filmu."));
        };

        video.src = url;
    });
}

async function prepareMedia(file) {
    if (file.type.startsWith("image/")) {
        return {
            media: await imageToBase64(file),
            type: "image",
            thumbnail: "",
            duration: ""
        };
    }

    if (!file.type.startsWith("video/")) {
        throw new Error("Wybierz zdjęcie albo film.");
    }

    if (file.size > LARGE_VIDEO_WARNING_BYTES) {
        showMessage(`Uwaga: ${file.name} jest dużym filmem. Jeśli zapis się nie uda, wybierz krótszy film.`, "warning");
    }

    const [media, details] = await Promise.all([
        readFileAsDataUrl(file),
        getVideoDetails(file).catch(() => ({ thumbnail: "", duration: "" }))
    ]);

    return { media, type: "video", ...details };
}

function setFiles(files) {
    const transfer = new DataTransfer();
    files.forEach(file => transfer.items.add(file));
    fileInput.files = transfer.files;
    showMessage(`Wybrano plików: ${fileInput.files.length}.`, "info");
}

["dragenter", "dragover"].forEach(eventName => {
    dropZone.addEventListener(eventName, event => {
        event.preventDefault();
        dropZone.classList.add("drag-over");
    });
});

["dragleave", "drop"].forEach(eventName => {
    dropZone.addEventListener(eventName, event => {
        event.preventDefault();
        dropZone.classList.remove("drag-over");
    });
});

dropZone.addEventListener("drop", event => {
    setFiles(Array.from(event.dataTransfer.files).filter(file => file.type.startsWith("image/") || file.type.startsWith("video/")));
});

uploadBtn.addEventListener("click", async () => {
    const files = Array.from(fileInput.files);

    if (!canUpload) {
        showMessage("Do dodawania wpisz hasło uploadu albo zaloguj się jako admin.", "error");
        return;
    }

    if (!files.length) {
        showMessage("Wybierz zdjęcie albo film do dodania.", "error");
        return;
    }

    uploadBtn.disabled = true;
    showMessage(`Dodawanie plików: 0/${files.length}`, "info");

    try {
        for (const [index, file] of files.entries()) {
            const prepared = await prepareMedia(file);

            if (prepared.media.length > 900_000) {
                throw new Error(`${file.name} jest za duży. Wybierz mniejszy plik albo krótszy film.`);
            }

            await addDoc(collection(db, "photos"), {
                image: prepared.media,
                media: prepared.media,
                thumbnail: prepared.thumbnail,
                duration: prepared.duration,
                description: "",
                type: prepared.type,
                user: auth.currentUser?.displayName || auth.currentUser?.email || (passwordMode === "upload" ? "Upload" : "Hasło"),
                uid: auth.currentUser?.uid || passwordMode || "password",
                time: Date.now() + index
            });

            showMessage(`Dodawanie plików: ${index + 1}/${files.length}`, "info");
        }

        fileInput.value = "";
        showMessage(files.length === 1 ? "Plik dodany." : "Pliki dodane.", "success");
    } catch (error) {
        showError(error);
    } finally {
        uploadBtn.disabled = false;
    }
});

function loadGallery() {
    if (unsubscribeGallery || !canPreview) return;

    gallery.innerHTML = '<p class="empty">Ładowanie galerii...</p>';
    const photosQuery = query(collection(db, "photos"), orderBy("time", "desc"));

    unsubscribeGallery = onSnapshot(photosQuery, snap => {
        allPhotos = snap.docs;
        selectedPhotos.clear();
        renderGallery();
        openPhotoFromHash();
    }, showError);
}

function renderGallery() {
    if (!canPreview) return;

    gallery.innerHTML = "";
    galleryToolbar.style.display = allPhotos.length ? "flex" : "none";
    selectAllBtn.style.display = canManage && allPhotos.length ? "inline-flex" : "none";
    bulkDeleteBtn.style.display = canManage && selectedPhotos.size ? "inline-flex" : "none";
    galleryCount.textContent = allPhotos.length ? `Zdjęć / filmów: ${allPhotos.length}` : "";

    if (!allPhotos.length) {
        gallery.innerHTML = '<p class="empty">Brak zdjęć. Dodaj pierwsze zdjęcie.</p>';
        loadMoreBtn.style.display = "none";
        return;
    }

    allPhotos.slice(0, displayedCount).forEach(photoDoc => {
        gallery.appendChild(createPhotoCard(photoDoc));
    });

    loadMoreBtn.style.display = displayedCount < allPhotos.length ? "inline-flex" : "none";
    updateBulkControls();
}

function createPhotoCard(photoDoc) {
    const data = photoDoc.data();
    const div = document.createElement("div");
    div.className = "photo";
    div.dataset.photoId = photoDoc.id;
    if (selectedPhotos.has(photoDoc.id)) div.classList.add("selected");

    if (canManage) {
        const check = document.createElement("input");
        check.type = "checkbox";
        check.className = "photo-check";
        check.checked = selectedPhotos.has(photoDoc.id);
        check.addEventListener("change", () => {
            if (check.checked) selectedPhotos.add(photoDoc.id);
            else selectedPhotos.delete(photoDoc.id);
            div.classList.toggle("selected", check.checked);
            updateBulkControls();
        });
        div.appendChild(check);
    }

    const mediaSrc = data.media || data.image;
    const isVideo = data.type === "video";
    const mediaWrap = document.createElement("div");
    mediaWrap.className = "media-wrap";
    const media = document.createElement(isVideo && !data.thumbnail ? "video" : "img");
    media.src = isVideo && data.thumbnail ? data.thumbnail : mediaSrc;

    if (isVideo && !data.thumbnail) {
        media.preload = "metadata";
        media.muted = true;
    } else {
        media.alt = `Zdjęcie dodane przez ${data.user || "użytkownika"}`;
    }

    media.addEventListener("click", () => openViewerById(photoDoc.id));
    mediaWrap.appendChild(media);
    mediaWrap.appendChild(createBadge(WATERMARK_TEXT, "media-watermark"));

    if (isVideo) {
        mediaWrap.appendChild(createBadge("FILM", "video-badge"));
        if (data.duration) mediaWrap.appendChild(createBadge(data.duration, "duration-badge"));
    }

    const meta = document.createElement("p");
    meta.className = "photo-meta";
    meta.textContent = data.user ? `Autor: ${data.user}` : "Autor nieznany";

    const description = document.createElement("p");
    description.className = "photo-description";
    description.textContent = data.description || "Brak opisu.";

    div.append(mediaWrap, meta, description, createPhotoActions(photoDoc));
    return div;
}

function createBadge(text, className) {
    const badge = document.createElement("span");
    badge.className = className;
    badge.textContent = text;
    return badge;
}

function createPhotoActions(photoDoc) {
    const actions = document.createElement("div");
    actions.className = "photo-actions";

    const download = document.createElement("button");
    download.className = "secondary-btn";
    download.type = "button";
    download.textContent = "Pobierz";
    download.addEventListener("click", () => downloadPhoto(photoDoc.id));
    actions.appendChild(download);

    const copy = document.createElement("button");
    copy.className = "secondary-btn";
    copy.type = "button";
    copy.textContent = "Kopiuj link";
    copy.addEventListener("click", () => copyPhotoLink(photoDoc.id));
    actions.appendChild(copy);

    if (canManage) {
        const edit = document.createElement("button");
        edit.className = "secondary-btn";
        edit.type = "button";
        edit.textContent = "Edytuj opis";
        edit.addEventListener("click", () => editDescription(photoDoc));
        actions.appendChild(edit);

        actions.appendChild(createDeleteButton(photoDoc.id));
    }

    return actions;
}

function updateBulkControls() {
    bulkDeleteBtn.style.display = canManage && selectedPhotos.size ? "inline-flex" : "none";
    bulkDeleteBtn.textContent = selectedPhotos.size ? `Usuń zaznaczone (${selectedPhotos.size})` : "Usuń zaznaczone";
    selectAllBtn.textContent = selectedPhotos.size === Math.min(displayedCount, allPhotos.length) ? "Odznacz wszystko" : "Zaznacz wszystko";
}

function createDeleteButton(photoId) {
    const deleteBtn = document.createElement("button");
    deleteBtn.className = "delete-btn";
    deleteBtn.type = "button";
    deleteBtn.textContent = "Usuń";
    deleteBtn.addEventListener("click", async () => {
        if (!canManage) {
            showMessage("Brak uprawnień do usuwania.", "error");
            return;
        }

        if (!confirm("Usunąć ten plik?")) return;
        deleteBtn.disabled = true;
        try {
            await deleteDoc(doc(db, "photos", photoId));
            showMessage("Usunięto plik.", "success");
        } catch (error) {
            showError(error);
            deleteBtn.disabled = false;
        }
    });

    return deleteBtn;
}

async function editDescription(photoDoc) {
    if (!canManage) {
        showMessage("Brak uprawnień do edycji opisu.", "error");
        return;
    }

    const current = photoDoc.data().description || "";
    const next = prompt("Opis zdjęcia / filmu:", current);
    if (next === null) return;

    try {
        await updateDoc(doc(db, "photos", photoDoc.id), { description: next.trim() });
        showMessage("Opis zapisany.", "success");
    } catch (error) {
        showError(error);
    }
}

selectAllBtn.addEventListener("click", () => {
    const visibleIds = allPhotos.slice(0, displayedCount).map(photoDoc => photoDoc.id);
    const allSelected = visibleIds.every(id => selectedPhotos.has(id));
    visibleIds.forEach(id => {
        if (allSelected) selectedPhotos.delete(id);
        else selectedPhotos.add(id);
    });
    renderGallery();
});

bulkDeleteBtn.addEventListener("click", async () => {
    if (!canManage || !selectedPhotos.size) return;
    if (!confirm(`Usunąć zaznaczone pliki (${selectedPhotos.size})?`)) return;

    try {
        const batch = writeBatch(db);
        selectedPhotos.forEach(photoId => batch.delete(doc(db, "photos", photoId)));
        await batch.commit();
        showMessage("Usunięto zaznaczone pliki.", "success");
        selectedPhotos.clear();
        renderGallery();
    } catch (error) {
        showError(error);
    }
});

loadMoreBtn.addEventListener("click", () => {
    displayedCount += PAGE_SIZE;
    renderGallery();
});

function openViewerById(photoId) {
    const index = allPhotos.findIndex(photoDoc => photoDoc.id === photoId);
    if (index === -1) return;
    openViewer(index);
}

function openViewer(index) {
    currentViewerIndex = index;
    const photoDoc = allPhotos[index];
    const data = photoDoc.data();
    const mediaSrc = data.media || data.image;
    const isVideo = data.type === "video";

    viewer.classList.add("active");
    history.replaceState(null, "", `${location.pathname}${location.search}#photo=${photoDoc.id}`);

    if (isVideo) {
        viewerImg.style.display = "none";
        viewerVideo.style.display = "block";
        viewerVideo.src = mediaSrc;
    } else {
        viewerVideo.pause();
        viewerVideo.removeAttribute("src");
        viewerVideo.style.display = "none";
        viewerImg.style.display = "block";
        viewerImg.src = mediaSrc;
    }
}

function closeViewer() {
    viewer.classList.remove("active");
    viewerVideo.pause();
    viewerVideo.removeAttribute("src");
    currentViewerIndex = -1;
    if (location.hash.startsWith("#photo=")) {
        history.replaceState(null, "", `${location.pathname}${location.search}`);
    }
}

function showAdjacentPhoto(direction) {
    if (!allPhotos.length || currentViewerIndex === -1) return;
    const nextIndex = (currentViewerIndex + direction + allPhotos.length) % allPhotos.length;
    openViewer(nextIndex);
}

function getCurrentPhotoId() {
    return currentViewerIndex >= 0 ? allPhotos[currentViewerIndex]?.id : null;
}

document.getElementById("close").addEventListener("click", closeViewer);
prevBtn.addEventListener("click", () => showAdjacentPhoto(-1));
nextBtn.addEventListener("click", () => showAdjacentPhoto(1));
downloadBtn.addEventListener("click", () => downloadPhoto(getCurrentPhotoId()));
savePhoneBtn.addEventListener("click", () => savePhotoToPhone(getCurrentPhotoId()));
copyLinkBtn.addEventListener("click", () => copyPhotoLink(getCurrentPhotoId()));

viewer.addEventListener("click", event => {
    if (event.target === viewer) closeViewer();
});

document.addEventListener("keydown", event => {
    if (!viewer.classList.contains("active")) return;
    if (event.key === "Escape") closeViewer();
    if (event.key === "ArrowLeft") showAdjacentPhoto(-1);
    if (event.key === "ArrowRight") showAdjacentPhoto(1);
});

function openPhotoFromHash() {
    const match = location.hash.match(/^#photo=(.+)$/);
    if (!match) return;
    const id = decodeURIComponent(match[1]);
    if (allPhotos.some(photoDoc => photoDoc.id === id)) openViewerById(id);
}

window.addEventListener("hashchange", openPhotoFromHash);

function dataUrlToBlob(dataUrl) {
    const [meta, base64] = dataUrl.split(",");
    const mime = meta.match(/data:(.*?);/)?.[1] || "application/octet-stream";
    const bytes = atob(base64);
    const array = new Uint8Array(bytes.length);
    for (let index = 0; index < bytes.length; index += 1) array[index] = bytes.charCodeAt(index);
    return new Blob([array], { type: mime });
}

function drawWatermark(ctx, width, height, opacity = 0.78) {
    const fontSize = Math.max(18, Math.round(width / 32));
    ctx.save();
    ctx.font = `900 ${fontSize}px Arial`;
    ctx.textAlign = "right";
    ctx.textBaseline = "bottom";
    const padding = Math.round(fontSize * 0.7);
    const metrics = ctx.measureText(WATERMARK_TEXT);
    ctx.fillStyle = `rgba(0,0,0,${opacity * 0.58})`;
    ctx.fillRect(width - metrics.width - padding * 2, height - fontSize - padding * 2, metrics.width + padding * 1.4, fontSize + padding * 1.4);
    ctx.fillStyle = `rgba(255,255,255,${opacity})`;
    ctx.fillText(WATERMARK_TEXT, width - padding, height - padding);
    ctx.restore();
}

function watermarkedImageDataUrl(src) {
    return new Promise((resolve, reject) => {
        const img = new Image();
        img.onload = () => {
            const canvas = document.createElement("canvas");
            canvas.width = img.naturalWidth;
            canvas.height = img.naturalHeight;
            const ctx = canvas.getContext("2d");
            ctx.drawImage(img, 0, 0);
            drawWatermark(ctx, canvas.width, canvas.height);
            resolve(canvas.toDataURL("image/jpeg", 0.92));
        };
        img.onerror = () => reject(new Error("Nie udało się przygotować pobierania."));
        img.src = src;
    });
}

function watermarkedVideoBlob(src) {
    return new Promise((resolve, reject) => {
        if (!HTMLCanvasElement.prototype.captureStream || !window.MediaRecorder) {
            resolve(dataUrlToBlob(src));
            return;
        }

        const video = document.createElement("video");
        video.muted = true;
        video.playsInline = true;
        video.src = src;

        video.onloadedmetadata = async () => {
            try {
                const canvas = document.createElement("canvas");
                const width = video.videoWidth || 640;
                const height = video.videoHeight || 360;
                const maxSize = 1280;
                const scale = Math.min(1, maxSize / Math.max(width, height));
                canvas.width = Math.round(width * scale);
                canvas.height = Math.round(height * scale);
                const ctx = canvas.getContext("2d");
                const stream = canvas.captureStream(30);
                const mimeType = MediaRecorder.isTypeSupported("video/webm;codecs=vp9") ? "video/webm;codecs=vp9" : "video/webm";
                const recorder = new MediaRecorder(stream, { mimeType });
                const chunks = [];

                recorder.ondataavailable = event => {
                    if (event.data.size) chunks.push(event.data);
                };
                recorder.onerror = () => reject(new Error("Nie udało się dodać znaku wodnego do filmu."));
                recorder.onstop = () => resolve(new Blob(chunks, { type: "video/webm" }));

                function drawFrame() {
                    if (video.ended || video.paused) return;
                    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                    drawWatermark(ctx, canvas.width, canvas.height);
                    requestAnimationFrame(drawFrame);
                }

                recorder.start();
                await video.play();
                drawFrame();
                video.onended = () => recorder.stop();
            } catch (error) {
                reject(error);
            }
        };

        video.onerror = () => reject(new Error("Nie udało się przygotować filmu do pobrania."));
    });
}

async function getDownloadData(photoDoc) {
    const data = photoDoc.data();
    const mediaSrc = data.media || data.image;

    if (data.type === "video") {
        return {
            blob: await watermarkedVideoBlob(mediaSrc),
            filename: `film-z-drona-${photoDoc.id}.webm`
        };
    }

    const watermarked = await watermarkedImageDataUrl(mediaSrc);
    return {
        blob: dataUrlToBlob(watermarked),
        filename: `zdjecie-z-drona-${photoDoc.id}.jpg`
    };
}

async function downloadPhoto(photoId) {
    if (!photoId) return;
    const photoDoc = allPhotos.find(item => item.id === photoId);
    if (!photoDoc) return;

    try {
        const { blob, filename } = await getDownloadData(photoDoc);
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.href = url;
        link.download = filename;
        document.body.appendChild(link);
        link.click();
        link.remove();
        URL.revokeObjectURL(url);
        showMessage("Pobieranie gotowe. Zdjęcia mają znak wodny.", "success");
    } catch (error) {
        showError(error);
    }
}

async function savePhotoToPhone(photoId) {
    if (!photoId) return;
    const photoDoc = allPhotos.find(item => item.id === photoId);
    if (!photoDoc) return;

    try {
        const { blob, filename } = await getDownloadData(photoDoc);
        const file = new File([blob], filename, { type: blob.type });

        if (navigator.canShare?.({ files: [file] })) {
            await navigator.share({ files: [file], title: "Zdjęcia z drona" });
            showMessage("Udostępniono plik — możesz zapisać go w rolce aparatu.", "success");
            return;
        }

        await downloadPhoto(photoId);
        showMessage("Jeśli telefon nie zapisze automatycznie, otwórz pobrany plik i wybierz „Zapisz obraz/wideo”.", "info");
    } catch (error) {
        showError(error);
    }
}

async function copyPhotoLink(photoId) {
    if (!photoId) return;
    const link = `${location.origin}${location.pathname}${location.search}#photo=${photoId}`;

    try {
        await navigator.clipboard.writeText(link);
        showMessage("Link skopiowany.", "success");
    } catch (error) {
        const fallback = prompt("Skopiuj link:", link);
        if (fallback !== null) showMessage("Link gotowy do skopiowania.", "info");
    }
}

if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("sw.js").catch(error => {
        console.warn("Service worker nie został zarejestrowany.", error);
    });
}
</script>
